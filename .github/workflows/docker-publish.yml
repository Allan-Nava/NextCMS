name: docker-publish

# Builda e pubblica l'immagine di cms/ su ghcr.io.
#
# Riscritta in v0.4.0 (NC-46): la versione precedente usava `::set-output`
# (comando disabilitato da GitHub) e un blocco bash fatto a mano per calcolare
# i tag — quindi non girava più. Ora il tagging lo fa docker/metadata-action.

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # metadata-action normalizza il nome immagine in minuscolo (il repo è
      # "Allan-Nava/NextCMS", ghcr accetta solo lowercase) e deriva i tag:
      # branch -> nome branch, v1.2.3 -> 1.2.3 / 1.2 / 1, default branch -> latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTA: cms/Dockerfile non esegue `prisma generate` prima di `npm run
      # build`, quindi oggi la build può fallire — vedi NC-49.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          file: ./cms/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
