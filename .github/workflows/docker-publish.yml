name: docker-publish

# Builds and publishes the cms/ image to ghcr.io.
#
# Rewritten in v0.4.0 (NC-46): the previous version used `::set-output` (a
# command GitHub has disabled) plus a hand-rolled bash block to compute the
# tags, so it no longer ran. Tagging is now done by docker/metadata-action.

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # metadata-action lowercases the image name (the repo is
      # "Allan-Nava/NextCMS" and ghcr only accepts lowercase) and derives the
      # tags: branch -> branch name, v1.2.3 -> 1.2.3 / 1.2 / 1, default branch
      # -> latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cms/Dockerfile now runs `prisma generate` before `npm run build` and
      # ships the generated client into the runtime stage (NC-49).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          file: ./cms/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
