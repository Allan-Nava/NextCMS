name: "CodeQL"

# Analisi statica di sicurezza su JavaScript/TypeScript.
# Aggiornata in v0.4.0 (NC-45): girava su codeql-action@v2, ritirata da GitHub
# a gennaio 2025 — la workflow falliva a ogni esecuzione.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "34 7 * * 4"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality aggiunge le query di qualità a quelle di
          # sicurezza: su un repo WIP conviene vederle tutte.
          queries: security-and-quality

      # Nessun autobuild: il progetto è interpretato, e buildarlo qui
      # duplicherebbe il lavoro di ci.yml.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
