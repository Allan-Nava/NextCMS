name: "CodeQL"

# Static security analysis for JavaScript/TypeScript.
# Updated in v0.4.0 (NC-45): it ran on codeql-action@v2, retired by GitHub in
# January 2025 — the workflow failed on every run.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "34 7 * * 4"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds the quality queries on top of the
          # security ones: on a WIP repo it is worth seeing all of them.
          queries: security-and-quality

      # No autobuild: the project is interpreted, and building it here would
      # duplicate what ci.yml already does.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
