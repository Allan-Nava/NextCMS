name: CI

# Quality gate for the repository (NC-29). Before this workflow existed nothing
# checked that the project even compiled: only CodeQL, a Cypress job with no
# tests, and the Docker publish ran.
#
# Every job is a hard gate. Keep them green — do not silence a job, close the
# backlog item behind it.

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploy-time settings that live in files rather than in a dashboard. Cheap and
  # first, because getting these wrong fails a deploy before any of the build
  # jobs below would have caught it.
  manifests:
    name: manifests (node version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Vercel reads engines.node from the manifest at the project's Root
      # Directory, so every manifest a deploy might read has to agree (NC-72).
      - name: Node version is declared consistently
        run: node .github/scripts/check-engines.mjs

  # Public app plus the API. It is the only one with Prisma, so the client must
  # be generated before the typecheck: without `prisma generate` the
  # `Prisma.*Input` types used by the repo layer do not exist.
  cms:
    name: cms (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Prisma wants a syntactically valid URL even just to generate the client;
      # no connection is opened during generate, test or build.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nextcms?schema=public"
      # Any value works here: the unit tests set their own secret per case.
      JWT_SECRET: "ci-only-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Admin panel: no Prisma, talks to the cms/ API over HTTP.
  admin:
    name: admin (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

# NOTE — there is no job for `packages/`: `@nextcms/nextcms` depends on versions
# of its own sibling packages that were never published to npm
# (`@nextcms/generators@0.1.4`, `@nextcms/utils@0.1.10`), so `npm install` fails
# with notarget and the tests cannot run. The job comes back once NC-51 is fixed.
