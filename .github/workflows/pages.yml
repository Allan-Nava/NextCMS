name: Pages

# Publishes the documentation site in docs/ to GitHub Pages (NC-57).
#
# The site is plain static files — one HTML page and one stylesheet, no Jekyll and
# no build step — so this workflow only uploads and deploys it. `.nojekyll` keeps
# Pages from running its Jekyll pass over the directory.
#
# One-time setup in the repository: Settings → Pages → Source = "GitHub Actions".
# Without that this workflow succeeds at building and fails at deploying.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/scripts/check-anchors.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: an interrupted deploy
# can leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned like every other workflow rather than taking whatever the runner
      # ships: the repo declares Node 24 in three manifests and CI gates on it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Catches a broken tag or a duplicate id before it reaches the published
      # site — the reason this job exists at all rather than deploying straight
      # from the push.
      - name: Validate the HTML
        run: npx --yes html-validate@9 docs/index.html

      - name: Check that every internal anchor resolves
        run: node .github/scripts/check-anchors.mjs docs/index.html

      # A dead duplicate selector and a malformed logo are both invisible in a
      # screenshot; stylelint caught one of each while this page was built.
      #
      # Installed into the working directory rather than run through
      # `npx --package`: stylelint resolves a shared config named in `extends`
      # relative to the config file, so from the npx cache it cannot find
      # `stylelint-config-recommended` and the step dies with
      # `ConfigurationError: Could not find "stylelint-config-recommended"`.
      - name: Install the stylesheet linter
        run: npm install --no-save --no-audit --no-fund stylelint@16 stylelint-config-recommended@14

      - name: Lint the stylesheet
        run: npx stylelint --config docs/.stylelintrc.json "docs/assets/*.css"

      - name: SVG assets are well-formed
        run: |
          for file in docs/assets/*.svg; do
            echo "checking $file"
            xmllint --noout "$file"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
